services:
  db:
    image: postgres:16
    container_name: webgis-db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webgis"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: webgis-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

    environment:
      ADMINER_DEFAULT_SERVER: db

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
